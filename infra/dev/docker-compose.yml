services:
  db:
    image: mariadb:11.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  wordpress:
    image: wordpress:6.8-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp_data:/var/www/html
      - ../../apps/plugin/nimbus:/var/www/html/wp-content/plugins/nimbus
      - ../../apps/plugin/nimbus/tools/local-wp/mu-plugins:/var/www/html/wp-content/mu-plugins

  setup:
    image: wordpress:cli-php8.2
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WP_PATH: /var/www/html
      SITE_URL: http://localhost:8080
      SITE_TITLE: Nimbus Dev
      ADMIN_USER: admin
      ADMIN_PASSWORD: password
      ADMIN_EMAIL: admin@example.com
    working_dir: /var/www/html
    volumes:
      - wp_data:/var/www/html
      - ../../apps/plugin/nimbus:/var/www/html/wp-content/plugins/nimbus
      - ../../apps/plugin/nimbus/tools/local-wp:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/setup.sh"]
    restart: "no"

  wpcli:
    image: wordpress:cli-php8.2
    profiles:
      - cli
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    working_dir: /var/www/html
    volumes:
      - wp_data:/var/www/html
      - ../../apps/plugin/nimbus:/var/www/html/wp-content/plugins/nimbus
    entrypoint: ["wp", "--allow-root", "--path=/var/www/html"]

  # MinIO: S3-compatible object storage used for local/CI testing.
  # Access key: minioadmin / minioadmin  (change for production)
  # API:     http://localhost:9000
  # Console: http://localhost:9001
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot container that creates the test bucket on first startup.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/nimbus-test &&
        mc anonymous set download local/nimbus-test &&
        echo 'MinIO bucket ready.'
      "
    restart: "no"

volumes:
  db_data:
  wp_data:
  minio_data:
